<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Recognition - Test A</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background: #1a1a1a; color: #e0e0e0; }
        #status { margin: 15px; font-weight: bold; color: #ffcc00; }
        #settings { background: #2a2a2a; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #444; }
        .control-group { margin-bottom: 20px; }
        label { display: flex; justify-content: space-between; font-size: 0.85em; margin-bottom: 8px; color: #bbb; }
        input[type="range"] { width: 100%; accent-color: #00d4ff; }
        #transcript { width: 100%; max-width: 400px; height: 200px; margin-top: 20px; background: #000; padding: 15px; border-radius: 8px; overflow-y: auto; color: #00ff41; border: 1px solid #333; }
        button { padding: 18px 40px; font-size: 1.2em; font-weight: bold; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 50px; }
        button.recording { background: #dc3545; }
    </style>
</head>
<body>

    <h1>Verification Mode: A</h1>
    <div id="status">システム待機中</div>

    <div id="settings">
        <div class="control-group">
            <label>ベースノイズ音量 <span id="baseValDisplay">0.01</span></label>
            <input type="range" id="baseVol" min="0" max="0.1" step="0.005" value="0.01">
        </div>
        <div class="control-group">
            <label>相槌の強さ（検証用） <span id="waveValDisplay">0.05</span></label>
            <input type="range" id="waveVol" min="0" max="0.3" step="0.01" value="0.05">
        </div>
    </div>

    <div id="transcript"></div>
    <div style="margin-top:10px; font-size:0.8em; color:#888;">※ interimResults: false 設定中</div>

    <div class="btn-container" style="margin-top:20px;">
        <button id="startBtn">START</button>
    </div>

    <script>
        let isRecording = false;
        let audioCtx = null;
        let noiseNode = null;
        let gainNode = null;
        let recognition = null;

        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');
        const transcriptDiv = document.getElementById('transcript');
        const baseVolInput = document.getElementById('baseVol');
        const waveVolInput = document.getElementById('waveVol');
        const baseValDisplay = document.getElementById('baseValDisplay');
        const waveValDisplay = document.getElementById('waveValDisplay');

        baseVolInput.oninput = (e) => baseValDisplay.textContent = e.target.value;
        waveVolInput.oninput = (e) => waveValDisplay.textContent = e.target.value;

        // ピンクノイズ生成
        function createPinkNoise() {
            const bufferSize = 4096;
            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
            const node = audioCtx.createScriptProcessor(bufferSize, 1, 1);
            node.onaudioprocess = function(e) {
                const output = e.outputBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    b0 = 0.99886 * b0 + white * 0.0555179;
                    b1 = 0.99332 * b1 + white * 0.0750759;
                    b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856;
                    b4 = 0.55000 * b4 + white * 0.5329522;
                    b5 = -0.7616 * b5 - white * 0.0168980;
                    output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
                    b6 = white * 0.115926;
                }
            };
            return node;
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                noiseNode = createPinkNoise();
                gainNode = audioCtx.createGain();
                gainNode.gain.value = parseFloat(baseVolInput.value);
                noiseNode.connect(gainNode);
                gainNode.connect(audioCtx.destination);
            }
        }

        function startRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.continuous = true;
            
            // 【検証項目A】中間結果をオフにする
            recognition.interimResults = false;

            recognition.onstart = () => {
                isRecording = true;
                status.textContent = "検証稼働中...";
                startBtn.classList.add('recording');
                startBtn.textContent = "STOP";
            };

            recognition.onresult = (event) => {
                // interimResults: false のため、文章が確定した時のみここが走る
                const text = event.results[event.results.length - 1][0].transcript;
                transcriptDiv.innerHTML += `<div>> ${text}</div>`;
                transcriptDiv.scrollTop = transcriptDiv.scrollHeight;

                // 確定時に一瞬ノイズを強める（相槌演出）
                const base = parseFloat(baseVolInput.value);
                const wave = parseFloat(waveVolInput.value);
                gainNode.gain.setTargetAtTime(base + wave, audioCtx.currentTime, 0.05);
                gainNode.gain.setTargetAtTime(base, audioCtx.currentTime + 0.5, 0.2);
            };

            recognition.onend = () => {
                if (isRecording) {
                    recognition.start();
                } else {
                    status.textContent = "停止中";
                    startBtn.classList.remove('recording');
                }
            };

            recognition.start();
        }

        startBtn.onclick = () => {
            if (!isRecording) {
                initAudio();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                startRecognition();
            } else {
                isRecording = false;
                recognition.stop();
                if (gainNode) gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
            }
        };
    </script>
</body>
</html>
